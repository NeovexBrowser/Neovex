<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title>$i18n{title}</title>
  <link rel="icon" type="image/svg+xml" href="../../../../ui/webui/resources/images/incognito_icon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link id="incognitothemecss" rel="stylesheet">
  <script>
    document.querySelector('#incognitothemecss').href =
      'chrome://theme/css/incognito_tab_theme.css?' + Date.now();
  </script>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  <link rel="stylesheet" href="incognito_tab.css">
  <style>
    .bg-custom {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      background-image: url('$i18n{neovexWallpaperDarkUrl}');
      display: block;
    }
    @media (prefers-color-scheme: light) {
      .bg-custom {
        background-image: url('$i18n{neovexWallpaperLightUrl}');
      }
    }
  </style>
</head>
<body>
  <div id="bgCustom" class="bg-custom"></div>
  <div class="bg-overlay"></div>

  <!-- Tor Loading Overlay -->
  <div class="tor-overlay" id="tor-overlay">
    <div class="tor-overlay-content">
      <div class="tor-logo"></div>
      <h2 class="tor-overlay-title">Connecting to Tor Network</h2>
      <p class="tor-overlay-subtitle">Securing your connection...</p>
      <div class="tor-loading-container">
        <div class="tor-loading-bar" id="tor-progress"></div>
      </div>
      <div id="tor-logs" class="tor-logs"></div>
    </div>
  </div>

  <div class="ntp-canvas">
    <!-- Top-left: Clock & Incognito/Private Badge -->
    <div class="top-left anim-1 dim-on-search">
      <div id="clock" class="clock-display">00:00</div>
      <div class="incognito-badge">
        <svg class="incognito-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
          <path d="M12 6a4 4 0 0 0-4 4h8a4 4 0 0 0-4-4z"/>
          <circle cx="9" cy="14" r="1.5"/>
          <circle cx="15" cy="14" r="1.5"/>
        </svg>
        <span class="incognito-badge-text">Incognito Mode</span>
      </div>
    </div>

    <!-- Top-right: Tor Toggle -->
    <div class="top-right anim-1 dim-on-search">
      <div id="tor-toggle-container" class="tor-toggle-container">
        <label class="tor-toggle-label" for="tor-toggle-switch">
          <div class="tor-toggle-info">
            <span class="tor-toggle-icon" id="tor-toggle-icon"></span>
            <span class="tor-toggle-text" id="tor-toggle-text">Tor Disabled</span>
          </div>
          <div class="tor-switch">
            <input type="checkbox" id="tor-toggle-switch">
            <span class="tor-slider"></span>
          </div>
        </label>
      </div>
    </div>

    <!-- Center content: Search input & subtle privacy status badge -->
    <div class="center-content anim-2">
      <div class="search-wrapper" id="searchBar">
        <input type="text" id="searchInput" class="search-input" placeholder=" " autofocus autocomplete="off" />
        <span class="search-prompt">Search privately...</span>
        <div class="search-line"></div>
        <button id="searchBtn" style="display:none;"></button>
      </div>

      <div class="privacy-notice-pill dim-on-search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Your browsing history, cookies, and form data aren't saved on this device.</span>
      </div>
    </div>
  </div>

  <script type="module" src="incognito_tab.js"></script>
</body>
</html>
