<!doctype html>
<html dir="$i18n{textdirection}" hascustombackground="$i18n{hasCustomBackground}" lang="$i18n{language}"
  class="md neovex-theme">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>$i18n{title}</title>
  <link rel="icon" type="image/svg+xml" href="../../../../ui/webui/resources/images/incognito_icon.svg">
  <meta name="viewport" content="width=device-width">
  <link id="incognitothemecss" rel="stylesheet">
  <script>
    // Until themes can clear the cache, force-reload the theme stylesheet. yayyy
    document.querySelector('#incognitothemecss').href =
      'chrome://theme/css/incognito_tab_theme.css?' + Date.now();
  </script>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  <link rel="stylesheet" href="incognito_tab.css">
</head>

<body>
  <!-- Tor Toggle Switch (top-left corner) -->
  <div id="tor-toggle-container" class="tor-toggle-container">
    <label class="tor-toggle-label" for="tor-toggle-switch">
      <div class="tor-toggle-info">
        <span class="tor-toggle-icon" id="tor-toggle-icon"></span>
        <span class="tor-toggle-text" id="tor-toggle-text">Tor Disabled</span>
      </div>
      <div class="tor-switch">
        <input type="checkbox" id="tor-toggle-switch">
        <span class="tor-slider"></span>
      </div>
    </label>
  </div>

  <!-- Tor Loading Overlay -->
  <div class="tor-overlay" id="tor-overlay">
    <div class="tor-overlay-content">
      <div class="tor-logo"></div>
      <h2 class="tor-overlay-title">Connecting to Tor Network</h2>
      <p class="tor-overlay-subtitle">Securing your connection...</p>
      <div class="tor-loading-container">
        <div class="tor-loading-bar" id="tor-progress"></div>
      </div>
      <div id="tor-logs" class="tor-logs"></div>
    </div>
  </div>

  <div class="content neovex-glass">
    <div class="icon" role="presentation" alt=""></div>
    <h1 class="gradient-text">$i18n{incognitoTabHeading}</h1>
    <p class="privacy-note neovex-highlight">Browsing through Tor - hides your activity from your ISP and masks your
      network identity.</p>

    <div id="cookie-controls" class="neovex-cookie-glass">
      <div id="cookie-controls-description">
        <div id="cookie-controls-header">
          <svg viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="m637-425-62-62q4-38-23-65.5T487-576l-62-62q13-5 27-7.5t28-2.5q70 0 119 49t49 119q0 14-2.5 28t-8.5 27Zm133 133-52-52q36-28 65.5-61.5T833-480q-49-101-144.5-158.5T480-696q-26 0-51 3t-49 10l-58-58q38-15 77.5-21t80.5-6q143 0 261.5 77.5T912-480q-22 57-58.5 103.5T770-292Zm-2 202L638-220q-38 14-77.5 21t-80.5 7q-143 0-261.5-77.5T48-480q22-57 58-104t84-85L90-769l51-51 678 679-51 51ZM241-617q-35 28-65 61.5T127-480q49 101 144.5 158.5T480-264q26 0 51-3.5t50-9.5l-45-45q-14 5-28 7.5t-28 2.5q-70 0-119-49t-49-119q0-14 3.5-28t6.5-28l-81-81Zm287 89Zm-96 96Z" />
          </svg>
          <em>$i18n{cookieControlsTitle}</em>
        </div>
        <span>$i18nRaw{cookieControlsDescription}</span>
      </div>
    </div>
    <a class="learn-more-button" href="$i18n{learnMoreLink}"
      aria-label="$i18nPolymer{learnMoreA11yLabel}">$i18n{learnMore}</a>
  </div>
  <script type="module" src="incognito_tab.js"></script>
  <!-- delay loading cr_elements to avoid performance penalty introduced by loading Polymer. coded by a goodboi -->
  <script type="module" src="chrome://resources/cr_elements/cr_toggle/cr_toggle.js" async></script>
  <script type="module" src="chrome://resources/cr_elements/policy/cr_tooltip_icon.js" async></script>
</body>

</html>
