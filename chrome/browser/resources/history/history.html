<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
<head>
  <link rel="icon" type="image/svg+xml" href="chrome://resources/images/neovex_logo.svg">
  <base href="chrome://history">
  <meta charset="utf8">
  <meta name="color-scheme" content="light dark">
  <title>$i18n{title}</title>

  <link rel="stylesheet" href="chrome://resources/css/md_colors.css">

  <style>
    html {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      height: 100%;
      margin: 0;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background: #0b0b14 !important;
        color: #e0e0e8 !important;
      }
      html {
        --md-background-color: transparent !important;
        --md-sys-color-surface: transparent !important;
        --md-sys-color-surface-variant: rgba(20, 20, 32, 0.5) !important;
        --md-sys-color-on-surface: #e0e0e8 !important;
        --md-sys-color-on-surface-variant: #b0b0c0 !important;
        --md-sys-color-primary: #7c8cff !important;
        --md-sys-color-on-primary: #fff !important;
        --md-sys-color-secondary-container: rgba(88,56,160,0.25) !important;
        --md-sys-color-outline: rgba(255,255,255,0.1) !important;
        --md-sys-color-outline-variant: rgba(255,255,255,0.06) !important;
        --cr-card-background-color: rgba(20, 20, 32, 0.5) !important;
        --cr-primary-text-color: #e0e0e8 !important;
        --cr-secondary-text-color: rgba(255,255,255,0.5) !important;
        --cr-card-shadow-color: rgba(0,0,0,0.3) !important;
        --google-blue-600: #7c8cff !important;
        --google-blue-300: #a0adff !important;
        --cr-active-background-color: rgba(88,56,160,0.2) !important;
        --cr-hover-background-color: rgba(255,255,255,0.05) !important;
        --cr-focus-outline-color: rgba(124,140,255,0.5) !important;
        --iron-icon-fill-color: rgba(255,255,255,0.5) !important;
        --cr-link-color: #a0adff !important;
        --cr-checked-color: #7c8cff !important;
        --cr-toggle-color: #7c8cff !important;
      }
      history-app, cr-toolbar {
        --cr-toolbar-background-color: rgba(16, 16, 28, 0.7) !important;
        --cr-toolbar-text-color: #e0e0e8 !important;
      }
    }

    @media (prefers-color-scheme: light) {
      html, body {
        background: #f5f5f0 !important;
        color: #1a1a1a !important;
      }
      html {
        --md-background-color: transparent !important;
        --md-sys-color-surface: rgba(255,255,255,0.7) !important;
        --md-sys-color-surface-variant: rgba(240,240,235,0.8) !important;
        --md-sys-color-on-surface: #1a1a1a !important;
        --md-sys-color-on-surface-variant: #444 !important;
        --md-sys-color-primary: #3d4edb !important;
        --md-sys-color-on-primary: #fff !important;
        --md-sys-color-secondary-container: rgba(61,78,219,0.1) !important;
        --md-sys-color-outline: rgba(0,0,0,0.12) !important;
        --md-sys-color-outline-variant: rgba(0,0,0,0.07) !important;
        --cr-card-background-color: rgba(255,255,255,0.85) !important;
        --cr-primary-text-color: #1a1a1a !important;
        --cr-secondary-text-color: rgba(0,0,0,0.5) !important;
        --cr-card-shadow-color: rgba(0,0,0,0.08) !important;
        --google-blue-600: #3d4edb !important;
        --google-blue-300: #6b7be8 !important;
        --cr-active-background-color: rgba(61,78,219,0.1) !important;
        --cr-hover-background-color: rgba(0,0,0,0.04) !important;
        --cr-focus-outline-color: rgba(61,78,219,0.4) !important;
        --iron-icon-fill-color: rgba(0,0,0,0.5) !important;
        --cr-link-color: #3d4edb !important;
        --cr-checked-color: #3d4edb !important;
        --cr-toggle-color: #3d4edb !important;
      }
      history-app, cr-toolbar {
        --cr-toolbar-background-color: rgba(245,245,240,0.9) !important;
        --cr-toolbar-text-color: #1a1a1a !important;
      }
    }

    /* === NTP Ambient Background === */

    /* Minimal styling required to display app shim. */
    .loading history-app {
      visibility: hidden;
    }

    #app-shim {
      display: none;
    }

    .loading #app-shim {
      display: block;
      position: absolute;
      inset: 0;
      font-size: 123%;
      color: var(--md-loading-message-color);
      font-weight: 500;
      align-content: center;
      text-align: center;
    }
  </style>
</head>
<body class="loading">
  <!-- Ambient background orbs (same as NTP) -->
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  <script type="module" src="history.js"></script>
</body>
</html>
