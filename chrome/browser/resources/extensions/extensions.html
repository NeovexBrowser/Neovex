<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}"
    class="loading $i18n{loadTimeClasses}">
<head>
  <link rel="icon" type="image/svg+xml" href="chrome://resources/images/neovex_logo.svg">
  <meta charset="utf8">
  <meta name="color-scheme" content="light dark">
  <title>$i18n{title}</title>
  <base href="chrome://extensions">
  <link rel="stylesheet" href="chrome://resources/css/md_colors.css">
  <style>
    html {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      height: 100%;
      margin: 0;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background: #0b0b14 !important;
        color: #e0e0e8 !important;
      }
      html {
        --md-background-color: transparent !important;
        --md-sys-color-surface: transparent !important;
        --md-sys-color-surface-variant: rgba(20, 20, 32, 0.5) !important;
        --md-sys-color-on-surface: #e0e0e8 !important;
        --md-sys-color-on-surface-variant: #b0b0c0 !important;
        --md-sys-color-primary: #7c8cff !important;
        --md-sys-color-on-primary: #fff !important;
        --md-sys-color-secondary-container: rgba(88,56,160,0.25) !important;
        --md-sys-color-outline: rgba(255,255,255,0.1) !important;
        --md-sys-color-outline-variant: rgba(255,255,255,0.06) !important;
        --cr-card-background-color: rgba(20, 20, 32, 0.5) !important;
        --cr-primary-text-color: #e0e0e8 !important;
        --cr-secondary-text-color: rgba(255,255,255,0.5) !important;
        --cr-card-shadow-color: rgba(0,0,0,0.3) !important;
        --google-blue-600: #7c8cff !important;
        --google-blue-300: #a0adff !important;
        --cr-active-background-color: rgba(88,56,160,0.2) !important;
        --cr-hover-background-color: rgba(255,255,255,0.05) !important;
        --cr-focus-outline-color: rgba(124,140,255,0.5) !important;
        --iron-icon-fill-color: rgba(255,255,255,0.5) !important;
        --cr-link-color: #a0adff !important;
        --cr-checked-color: #7c8cff !important;
        --cr-toggle-color: #7c8cff !important;
      }
      extensions-manager, cr-toolbar {
        --cr-toolbar-background-color: rgba(16, 16, 28, 0.7) !important;
        --cr-toolbar-text-color: #e0e0e8 !important;
      }
    }

    @media (prefers-color-scheme: light) {
      html, body {
        background: #f5f5f0 !important;
        color: #1a1a1a !important;
      }
      html {
        --md-background-color: transparent !important;
        --md-sys-color-surface: rgba(255,255,255,0.7) !important;
        --md-sys-color-surface-variant: rgba(240,240,235,0.8) !important;
        --md-sys-color-on-surface: #1a1a1a !important;
        --md-sys-color-on-surface-variant: #444 !important;
        --md-sys-color-primary: #3d4edb !important;
        --md-sys-color-on-primary: #fff !important;
        --md-sys-color-secondary-container: rgba(61,78,219,0.1) !important;
        --md-sys-color-outline: rgba(0,0,0,0.12) !important;
        --md-sys-color-outline-variant: rgba(0,0,0,0.07) !important;
        --cr-card-background-color: rgba(255,255,255,0.85) !important;
        --cr-primary-text-color: #1a1a1a !important;
        --cr-secondary-text-color: rgba(0,0,0,0.5) !important;
        --cr-card-shadow-color: rgba(0,0,0,0.08) !important;
        --google-blue-600: #3d4edb !important;
        --google-blue-300: #6b7be8 !important;
        --cr-active-background-color: rgba(61,78,219,0.1) !important;
        --cr-hover-background-color: rgba(0,0,0,0.04) !important;
        --cr-focus-outline-color: rgba(61,78,219,0.4) !important;
        --iron-icon-fill-color: rgba(0,0,0,0.5) !important;
        --cr-link-color: #3d4edb !important;
        --cr-checked-color: #3d4edb !important;
        --cr-toggle-color: #3d4edb !important;
      }
      extensions-manager, cr-toolbar {
        --cr-toolbar-background-color: rgba(245,245,240,0.9) !important;
        --cr-toolbar-text-color: #1a1a1a !important;
      }
    }

    html.has-custom-bg, body.has-custom-bg {
      background: transparent !important;
    }
    html.has-custom-bg extensions-manager {
      background: transparent !important;
    }

    /* Mimics the developer mode toolbar until the real one loads. Note:
     * .in-dev-mode is applied by i18n{loadTimeClasses}. */
    html.loading.in-dev-mode body::before {
      box-sizing: border-box;
      content: '';
      display: block;
      border-bottom: var(--md-toolbar-border);
      height: calc(var(--md-toolbar-height) + 58px);
    }
  </style>
  <script type="module" src="extensions.js"></script>
</head>
<body>
  <extensions-manager></extensions-manager>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
<script>
(function() {
  function applyBg(bg, theme) {
    var el = document.getElementById('neovex-bg-custom');
    if (!el) {
      el = document.createElement('div');
      el.id = 'neovex-bg-custom';
      el.style.position = 'fixed';
      el.style.inset = '0';
      el.style.zIndex = '-2';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      el.style.backgroundRepeat = 'no-repeat';
      el.style.pointerEvents = 'none';
      el.style.display = 'none';
      document.body.prepend(el);
    }
    var overlay = document.getElementById('neovex-bg-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'neovex-bg-overlay';
      overlay.style.position = 'fixed';
      overlay.style.inset = '0';
      overlay.style.zIndex = '-1';
      overlay.style.pointerEvents = 'none';
      overlay.style.display = 'none';
      document.body.prepend(overlay);
    }

    var isLight = (theme === 'light') || document.documentElement.classList.contains('light-mode');

    if (bg) {
      var resolvedBg = bg;
      if (resolvedBg.startsWith('wallpapers/')) {
        var isAlreadyLight = resolvedBg.includes('_light.');
        if (isLight && !isAlreadyLight) {
          resolvedBg = resolvedBg.replace(/\.(png|jpg|jpeg)$/i, '_light.png');
        } else if (!isLight && isAlreadyLight) {
          if (resolvedBg.includes('default_light')) {
            resolvedBg = resolvedBg.replace('_light.png', '.jpg');
          } else {
            resolvedBg = resolvedBg.replace('_light.png', '.png');
          }
        }
        resolvedBg = 'chrome://new-tab-page/' + resolvedBg;
      }
      el.style.backgroundImage = 'url("' + resolvedBg + '")';
      el.style.display = 'block';
      document.documentElement.classList.add('has-custom-bg');
      document.body.classList.add('has-custom-bg');

      if (!isLight) {
        overlay.style.background = 'radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%)';
        overlay.style.display = 'block';
      } else {
        overlay.style.background = 'rgba(245, 245, 240, 0.6)';
        overlay.style.display = 'block';
      }
    } else {
      el.style.display = 'none';
      overlay.style.display = 'none';
      document.documentElement.classList.remove('has-custom-bg');
      document.body.classList.remove('has-custom-bg');
    }
  }

  function loadShared() {
    var loadedTheme = 'dark';
    var i18nBg = '$i18n{neovexWallpaper}';
    if (i18nBg && i18nBg !== 'neovexWallpaper' && !i18nBg.startsWith('$i18n')) {
      applyBg(i18nBg, loadedTheme);
    }
    try {
      var request = indexedDB.open('NeovexShared', 1);
      request.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
      };
      request.onsuccess = function(e) {
        var db = e.target.result;
        try {
          var tx = db.transaction('settings', 'readonly');
          var store = tx.objectStore('settings');
          var reqBg = store.get('ntp_bg');
          var reqTheme = store.get('neovex_theme');

          reqTheme.onsuccess = function() {
            loadedTheme = reqTheme.result || 'dark';
            if (i18nBg && i18nBg !== 'neovexWallpaper' && !i18nBg.startsWith('$i18n')) {
              applyBg(i18nBg, loadedTheme);
            }
          };
          reqBg.onsuccess = function() {
            var idbBg = reqBg.result;
            if (idbBg) applyBg(idbBg, loadedTheme);
          };
        } catch(err) {}
      };
    } catch(e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadShared);
  } else {
    loadShared();
  }
})();

</script>
</body>
</html>
